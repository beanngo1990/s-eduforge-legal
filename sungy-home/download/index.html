<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Download Sungy App</title>
  <meta name="description" content="Download Sungy – Fun & Interactive Early English Learning App for iOS and Android.">
  <link rel="icon" type="image/png" href="../icon.png">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F2FAFE;
      color: #2C3E50;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 40px 24px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(40,191,178,0.12);
      max-width: 400px;
      width: 100%;
      border: 1px solid #D7EEF8;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #117B78;
      margin: 0 0 8px;
    }
    p {
      color: #64748B;
      font-size: 14px;
      margin: 0 0 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 20px;
      margin-bottom: 12px;
      border-radius: 14px;
      background: #1A202C;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: transparent;
      color: #28BFB2;
      border: 1.5px solid #28BFB2;
      margin-bottom: 0;
      margin-top: 8px;
    }
    .btn-secondary:hover {
      background: #CFF7F1;
    }
  </style>
  <script>
    (function redirect() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      // Check iOS (iPhone, iPad, iPod)
      if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
        window.location.replace("https://apps.apple.com/app/id6790650146");
        return;
      }
      // Check iPadOS 13+ (Macintosh userAgent with touch capabilities)
      if (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /Macintosh/.test(userAgent)) {
        window.location.replace("https://apps.apple.com/app/id6790650146");
        return;
      }
      // Check Android
      if (/android/i.test(userAgent)) {
        window.location.replace("https://play.google.com/store/apps/details?id=com.seduforge.skidsenglish");
        return;
      }
      // Desktop / Other OS -> Redirect to homepage
      window.location.replace("https://sungy.net/");
    })();
  </script>
</head>
<body>
  <div class="card">
    <img src="../icon.png" alt="Sungy Logo" class="icon">
    <h1>Redirecting to Store...</h1>
    <p>If you are not redirected automatically, please select your store below:</p>
    <a href="https://apps.apple.com/app/id6790650146" class="btn">🍏 Download on App Store</a>
    <a href="https://play.google.com/store/apps/details?id=com.seduforge.skidsenglish" class="btn">🤖 Get it on Google Play</a>
    <a href="https://sungy.net/" class="btn btn-secondary">🏠 Back to Sungy.net</a>
  </div>
</body>
</html>
